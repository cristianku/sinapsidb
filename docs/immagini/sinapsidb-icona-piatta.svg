<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SinapsiDB">
  <title>SinapsiDB</title>
  <rect width="512" height="512" rx="116" fill="#1f3594"/>

  <!-- le sinapsi: collegano i nodi dei tre livelli del database -->
  <path fill="none" stroke="#a9c9ff" stroke-opacity="0.75" stroke-width="7" stroke-linecap="round"
        d="M157 179 256 300M256 192 157 287M256 192 355 287M157 287 256 408M355 287 256 408M256 300 157 395M256 300 355 395"/>
  <path fill="none" stroke="#ff7a3d" stroke-width="10" stroke-linecap="round" d="M256 300 355 179"/>

  <!-- il cilindro del database -->
  <g fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round">
    <ellipse cx="256" cy="148" rx="140" ry="44" fill="#ffffff" fill-opacity="0.12"/>
    <path d="M116 148V364M396 148V364"/>
    <path d="M116 256A140 44 0 0 0 396 256"/>
    <path d="M116 364A140 44 0 0 0 396 364"/>
  </g>

  <!-- i nodi -->
  <g fill="#ffffff" stroke="#17246f" stroke-width="6">
    <circle cx="157" cy="179" r="15"/>
    <circle cx="256" cy="192" r="15"/>
    <circle cx="355" cy="179" r="15"/>
    <circle cx="157" cy="287" r="15"/>
    <circle cx="355" cy="287" r="15"/>
    <circle cx="157" cy="395" r="15"/>
    <circle cx="256" cy="408" r="15"/>
    <circle cx="355" cy="395" r="15"/>
  </g>

  <!-- il nodo acceso: una sinapsi che scatta -->
  <circle cx="256" cy="300" r="44" fill="#ff7a3d" fill-opacity="0.22"/><circle cx="256" cy="300" r="33" fill="#ff7a3d" fill-opacity="0.30"/>
  <circle cx="256" cy="300" r="21" fill="#ff7a3d" stroke="#ffffff" stroke-width="6"/>
</svg>
