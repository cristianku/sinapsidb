<title id="t">Time to the application, per question</title><desc id="d">Median times in microseconds, logarithmic scale. An invoice by its number: SinapsiDB 3.9 µs, PostgreSQL 40.0 µs, Redis cache 37.5 µs, A shipment by its number: SinapsiDB 3.9 µs, PostgreSQL 44.2 µs, Redis cache 37.5 µs, A customer&#x27;s invoices: SinapsiDB 7.0 µs, PostgreSQL 51.5 µs, Redis cache 38.9 µs, The lines of an invoice: SinapsiDB 5.1 µs, PostgreSQL 50.9 µs, Redis cache 37.8 µs, The payments of an invoice: SinapsiDB 3.6 µs, PostgreSQL 41.0 µs, Redis cache 37.4 µs, A supplier&#x27;s products: SinapsiDB 10.8 µs, PostgreSQL 73.4 µs, Redis cache 40.7 µs, Stock of a product in a warehouse: SinapsiDB 6.9 µs, PostgreSQL 41.3 µs, Redis cache 38.4 µs, A customer&#x27;s open tickets: SinapsiDB 5.4 µs, PostgreSQL 37.5 µs, Redis cache 36.8 µs, A customer&#x27;s revenue: SinapsiDB 8.2 µs, PostgreSQL 48.2 µs, Redis cache 37.9 µs, The payments of an order (2 steps): SinapsiDB 5.0 µs, PostgreSQL 46.0 µs, Redis cache 37.6 µs, Who bought a product (3 steps): SinapsiDB 56.0 µs, PostgreSQL 228 µs, Redis cache 44.9 µs, The suppliers behind a customer&#x27;s purchases (4 steps): SinapsiDB 25.1 µs, PostgreSQL 132 µs, Redis cache 40.6 µs, A customer on one day (three tables): SinapsiDB 9.2 µs, PostgreSQL 62.6 µs, Redis cache 39.7 µs, Revenue month by month: SinapsiDB 1.08 ms, PostgreSQL 31.1 ms, Redis cache 40.7 µs, Invoices above an amount: SinapsiDB 216 µs, PostgreSQL 500 µs, Redis cache 142 µs.</desc>
