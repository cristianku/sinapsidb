<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 684" width="640" height="684" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Which database answers faster?</title><desc id="d">Median time to the application over 15 queries on 1,001,658 records. SinapsiDB 7.0 µs, PostgreSQL 50.9 µs, Redis cache 38.4 µs. SinapsiDB answered faster than PostgreSQL on 15 of 15 queries and faster than the Redis cache on 12 of 15. Inside its own server the Redis cache, which returns answers prepared in advance, takes 0.5 µs and is faster on 15 of 15.</desc>
<style></style>
<defs><radialGradient id="sky" cx="90%" cy="-30%" r="80%"><stop offset="0" stop-color="#347d86" stop-opacity=".4"/><stop offset="1" stop-color="#347d86" stop-opacity="0"/></radialGradient></defs>
<rect x=".5" y=".5" width="639" height="683" rx="18" fill="#0c192a" stroke="#416880"/><rect x=".5" y=".5" width="639" height="683" rx="18" fill="url(#sky)"/><text x="24" y="40" font-size="12" font-weight="750" letter-spacing="1.1" fill="#92c9ff">APPLICATION BENCHMARK · 1,001,658 RECORDS</text><text x="24" y="74" font-size="27" font-weight="750" fill="#edf2ff" letter-spacing="-.6">Which database answers faster?</text><text x="24" y="100" font-size="14" fill="#b5c3db">Median time to the app: SinapsiDB in-process, PostgreSQL and the</text><text x="24" y="119" font-size="14" fill="#b5c3db">Redis cache over a local socket. Shorter is faster.</text><rect x="24" y="136" width="592" height="188" rx="12" fill="#0d1a2c" stroke="#385369"/><text x="44" y="166" font-size="15" font-weight="700" fill="#bceaff">SinapsiDB vs PostgreSQL</text><text x="44" y="200" font-size="25" font-weight="700" fill="#edf2ff" letter-spacing="-.5">SinapsiDB faster on <tspan fill="#9ff1d4">15 of 15</tspan> queries</text><text x="44" y="232" font-size="14" fill="#edf2ff">SinapsiDB</text><text x="516" y="232" font-size="14" font-weight="700" fill="#edf2ff" text-anchor="end">7.0 µs</text><text x="596" y="232" font-size="13" fill="#9ff1d4" text-anchor="end">Faster</text><rect x="44" y="240" width="552" height="6" rx="3" fill="#293b4d"/><rect x="44" y="240" width="76.3" height="6" rx="3" fill="#9ff1d4"/><text x="44" y="270" font-size="14" fill="#edf2ff">PostgreSQL</text><text x="516" y="270" font-size="14" font-weight="700" fill="#edf2ff" text-anchor="end">50.9 µs</text><text x="596" y="270" font-size="13" fill="#b5c3db" text-anchor="end">Slower</text><rect x="44" y="278" width="552" height="6" rx="3" fill="#293b4d"/><rect x="44" y="278" width="552.0" height="6" rx="3" fill="#a5b5c9"/><text x="44" y="310" font-size="14" fill="#edf2ff"><tspan font-size="18" font-weight="700">7.5×</tspan> SinapsiDB speedup¹</text><rect x="24" y="338" width="592" height="242" rx="12" fill="#0d1a2c" stroke="#385369"/><text x="44" y="368" font-size="15" font-weight="700" fill="#bceaff">SinapsiDB vs Redis cache</text><text x="44" y="402" font-size="25" font-weight="700" fill="#edf2ff" letter-spacing="-.5">SinapsiDB faster on <tspan fill="#9ff1d4">12 of 15</tspan> queries</text><text x="44" y="434" font-size="14" fill="#edf2ff">SinapsiDB</text><text x="516" y="434" font-size="14" font-weight="700" fill="#edf2ff" text-anchor="end">7.0 µs</text><text x="596" y="434" font-size="13" fill="#9ff1d4" text-anchor="end">Faster</text><rect x="44" y="442" width="552" height="6" rx="3" fill="#293b4d"/><rect x="44" y="442" width="76.3" height="6" rx="3" fill="#9ff1d4"/><text x="44" y="472" font-size="14" fill="#edf2ff">Redis cache</text><text x="516" y="472" font-size="14" font-weight="700" fill="#edf2ff" text-anchor="end">38.4 µs</text><text x="596" y="472" font-size="13" fill="#b5c3db" text-anchor="end">Slower</text><rect x="44" y="480" width="552" height="6" rx="3" fill="#293b4d"/><rect x="44" y="480" width="416.4" height="6" rx="3" fill="#a5b5c9"/><text x="44" y="512" font-size="14" fill="#edf2ff"><tspan font-size="18" font-weight="700">3.1×</tspan> SinapsiDB speedup¹</text><rect x="44" y="530" width="2" height="40" fill="#ffab77"/><text x="56" y="544" font-size="13.5" font-weight="700" fill="#edf2ff">Inside its own server the Redis cache is faster: 0.5 µs.</text><text x="56" y="564" font-size="13" fill="#b5c3db">Its prepared lookup wins on 15 of 15 queries when the round trip is excluded.</text><path d="M24 598.5H616" stroke="#39546a"/><text x="24" y="622" font-size="12.5" fill="#c4d1e2">¹ Geometric mean of the per-query speedups, not a ratio of medians.</text><text x="24" y="642" font-size="12.5" fill="#c4d1e2">Measured on November 23, 2026 with SinapsiDB 0.10.5 (C nucleus), PostgreSQL 17.12</text><text x="24" y="662" font-size="12.5" fill="#c4d1e2">and Redis 8.0.2, on one Linux machine with 8 GB of RAM.</text>
</svg>
